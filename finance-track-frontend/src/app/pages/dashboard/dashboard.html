<mat-toolbar color="primary">
    <mat-toolbar-row>
        <span>Dashboard</span>
        <span class="spacer"></span>
        <button mat-icon-button>
            <mat-icon>account_circle</mat-icon>
        </button>
    </mat-toolbar-row>
</mat-toolbar>

<mat-card class="balance-card">
    <mat-card-header>
        <mat-card-title>Total Balance</mat-card-title>
    </mat-card-header>

    <mat-card-content>
        <h2>$2,450.00</h2>
        <div class="balance-details">
            <span class="income">↑ Income: $3,000</span>
            <span class="expense">↓ Expense: $550</span>
        </div>
    </mat-card-content>
</mat-card>
<button mat-fab class="fab-button" (click)="navigateToTransactions()">
    <mat-icon>add</mat-icon>
</button>
<mat-card class="chart-card">
    <mat-card-header>
        <mat-card-title>Monthly Spending</mat-card-title>
    </mat-card-header>
    <mat-card-content>
        <p-chart type="bar" [data]="chartData" [options]="chartOptions" style="height: 200px"></p-chart>
    </mat-card-content>
</mat-card>
<mat-card class="transactions-card">
    <mat-card-header>
        <mat-card-title>Recent Transactions</mat-card-title>
    </mat-card-header>
    <mat-card-content>
        <mat-list>
            <mat-list-item *ngFor="let transaction of recentTransactions">
                <mat-icon matListItemIcon [class.income-icon]="transaction.type === 'income'"
                    [class.expense-icon]="transaction.type === 'expense'">
                    {{transaction.type === 'income' ? 'arrow_upward' : 'arrow_downward'}}
                </mat-icon>
                <div matListItemTitle>{{transaction.description}}</div>
                <div matListItemLine>{{transaction.date}}</div>
                <div matListItemMeta [class.income-amount]="transaction.type === 'income'"
                    [class.expense-amount]="transaction.type === 'expense'">
                    {{transaction.type === 'income' ? '+' : '-'}}${{transaction.amount}}
                </div>
            </mat-list-item>
        </mat-list>
    </mat-card-content>
</mat-card>
